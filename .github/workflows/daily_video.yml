name: Daily YouTube Automation

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 3:30 PM IST (10:00 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup YouTube Credentials
      env:
        YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
        YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      run: |
        if [ -n "$YOUTUBE_CLIENT_SECRET_B64" ]; then
          echo "$YOUTUBE_CLIENT_SECRET_B64" | base64 --decode > client_secret.json
        fi
        if [ -n "$YOUTUBE_TOKEN_B64" ]; then
          echo "$YOUTUBE_TOKEN_B64" | base64 --decode > token.pickle
        fi

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Batch Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        AUTOMATION_MODE: "fully-automated"
      run: |
        python run_daily_batch.py
